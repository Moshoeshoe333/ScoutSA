<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA matching triage smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:950px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:900px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Player–opportunity matching triage — smoke tests</h1><p>Fixture and UI checks only. No test establishes real-world eligibility, player ability, age, consent, identity, safeguarding, privacy, authorization or legal compliance.</p><ol id="results"></ol><iframe id="app" src="./player-opportunity-matching.html" title="Matching triage under test"></iframe><script>
const out=document.querySelector("#results");function test(name,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+name;out.append(li)}
const frame=document.querySelector("#app");frame.addEventListener("load",()=>{const d=frame.contentDocument,w=frame.contentWindow;try{const x=w.SCOUTSA_MATCHING_DEMO.pairs;test("six synthetic player–opportunity pairs render",d.querySelectorAll(".pair").length===6);test("no pair is represented as a match decision",x.every(p=>p.disposition!=="MATCH DECISION")&&d.querySelector("#decisions").textContent==="0");test("all six dimensions are represented",w.SCOUTSA_MATCHING_DEMO.dimensions.length===6&&d.querySelectorAll("#dimensions .rule").length===6);test("hard-stop findings derive from fixture",d.querySelector("#hardstops").textContent===String(x.reduce((n,p)=>n+p.findings.filter(f=>f[0]==="HARD STOP").length,0)));test("no direct player contact or invitation controls",!d.querySelector("button,form,input[type=submit]")&&!/send invitation|contact player|publish profile/i.test(d.body.innerText));d.querySelector("#search").value="Lerato Nkosi";d.querySelector("#search").dispatchEvent(new w.Event("input"));test("search filters matching pair cards",d.querySelectorAll(".pair").length===3);d.querySelector("#search").value="";d.querySelector("#search").dispatchEvent(new w.Event("input"));d.querySelector("#filter").value="NO MATCH DECISION — HOLD";d.querySelector("#filter").dispatchEvent(new w.Event("change"));test("hold filter preserves all held pairs",d.querySelectorAll(".pair").length===6);}catch(e){test("test harness completed without runtime error: "+e.message,false)}});
</script></body></html>
