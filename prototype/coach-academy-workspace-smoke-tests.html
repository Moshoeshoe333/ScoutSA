<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA academy workspace smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:950px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:900px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Coach & academy workspace — smoke tests</h1><p>Fixture/UI checks only. These do not validate real identity, role authority, tenant isolation, access control, RLS, privacy, safeguarding or legal compliance.</p><ol id="results"></ol><iframe id="app" src="./coach-academy-workspace.html" title="Academy workspace under test"></iframe><script>
const out=document.querySelector("#results");function test(n,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+n;out.append(li)}
document.querySelector("#app").addEventListener("load",()=>{const d=document.querySelector("#app").contentDocument,w=document.querySelector("#app").contentWindow;try{const x=w.SCOUTSA_ACADEMY_WORKSPACE_DEMO;test("one fictional organization context loads",x.organization.id==="ORG-DEMO-01"&&d.querySelector("#orgName").textContent===x.organization.name);test("summary counts match fixture",d.querySelector("#memberships").textContent===String(x.summary.membershipClaims)&&d.querySelector("#reviewClaims").textContent===String(x.summary.claimsNeedingReview)&&d.querySelector("#opportunities").textContent===String(x.summary.opportunityProposals)&&d.querySelector("#evidenceActions").textContent===String(x.summary.evidenceActions));test("membership summary has no player identities",d.querySelectorAll("#membershipList .item").length===x.memberships.length&&!d.querySelector("#membershipList").innerText.includes("Kabelo")&&!d.querySelector("#membershipList").innerText.includes("Lerato"));test("opportunity proposals remain visibly unverified/blocked",x.opportunities.every(o=>o.blocker.length>0)&&d.querySelectorAll("#opportunityList .item").length===2);test("all four evidence actions render",d.querySelectorAll("#actionList .action").length===4);test("access and production limitations are visible",d.body.innerText.includes("no authentication")&&d.body.innerText.includes("tenant isolation")&&d.body.innerText.includes("RLS"));test("no player roster, contact, invitation or mutation controls",!d.querySelector("form,input,button")&&!/player contact|send invitation|approve membership/i.test(d.body.innerText));}catch(e){test("test harness completed without runtime error: "+e.message,false)}});
</script></body></html>
