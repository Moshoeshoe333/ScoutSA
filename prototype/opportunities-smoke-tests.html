<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA opportunity prototype smoke tests</title><style>body{font:15px/1.5 system-ui;max-width:850px;margin:35px auto;padding:0 18px;color:#17263a}button{padding:10px 14px;border:0;border-radius:8px;background:#16845f;color:white;font-weight:700}iframe{width:100%;height:760px;border:1px solid #ccd5df;border-radius:10px;margin-top:16px}.pass{color:#16845f}.fail{color:#a43f42}</style></head><body><h1>Opportunity UI smoke tests</h1><p>Presentation and client-side filtering checks only. No backend, authorization, RLS, publication, invitation, application, safeguarding or legal-compliance behavior is tested.</p><button id="run">Run smoke tests</button><ol id="results"></ol><iframe title="Opportunity prototype under test" src="./opportunities.html"></iframe><script>
document.querySelector('#run').addEventListener('click',async()=>{const f=document.querySelector('iframe');await new Promise(resolve=>{if(f.contentDocument.readyState==='complete')resolve();else f.addEventListener('load',resolve,{once:true})});const d=f.contentDocument,w=f.contentWindow,checks=[];const check=(name,fn)=>{try{if(!fn())throw Error('condition false');checks.push([name,true])}catch(e){checks.push([name,false,e.message])}};check('Three fictional proposals render',()=>d.querySelectorAll('#records .record').length===3);check('Every record remains unverified',()=>[...d.querySelectorAll('#records .record')].every(x=>x.textContent.includes('Not verified')||x.textContent.includes('Evidence absent')));check('No invitations are issued',()=>[...d.querySelectorAll('#records .record')].every(x=>x.textContent.includes('Not issued')));check('Proposal-stage filter works',()=>{const s=d.querySelector('#stageFilter');s.value='Proposal only';s.dispatchEvent(new w.Event('change',{bubbles:true}));return d.querySelectorAll('#records .record').length===1});check('Search narrows the register',()=>{const s=d.querySelector('#stageFilter');s.value='all';s.dispatchEvent(new w.Event('change',{bubbles:true}));const q=d.querySelector('#search');q.value='Riverlands';q.dispatchEvent(new w.Event('input',{bubbles:true}));return d.querySelectorAll('#records .record').length===1});check('Empty state appears for unmatched query',()=>{const q=d.querySelector('#search');q.value='no-match';q.dispatchEvent(new w.Event('input',{bubbles:true}));return !!d.querySelector('.empty')});document.querySelector('#results').innerHTML=checks.map(([n,ok,e])=>'<li class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+n+(e?' ('+e+')':'')+'</li>').join('')});
</script></body></html>
