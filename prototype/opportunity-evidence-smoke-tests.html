<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA evidence review smoke tests</title><style>body{font:15px/1.5 system-ui;max-width:850px;margin:35px auto;padding:0 18px;color:#17263a}button{padding:10px 14px;border:0;border-radius:8px;background:#16845f;color:white;font-weight:700}iframe{width:100%;height:850px;border:1px solid #ccd5df;border-radius:10px;margin-top:16px}.pass{color:#16845f}.fail{color:#a43f42}</style></head><body><h1>Evidence review UI smoke tests</h1><p>Client-side presentation checks only. These do not validate real evidence, source authority, identity, security, RLS, privacy, safeguarding or legal compliance.</p><button id="run">Run smoke tests</button><ol id="results"></ol><iframe title="Evidence review prototype under test" src="./opportunity-evidence.html"></iframe><script>
document.querySelector('#run').addEventListener('click',async()=>{const f=document.querySelector('iframe');await new Promise(r=>{if(f.contentDocument.readyState==='complete')r();else f.addEventListener('load',r,{once:true})});const d=f.contentDocument,w=f.contentWindow,a=w.SCOUTSA_DEMO_EVIDENCE.entries,c=[];const check=(n,fn)=>{try{if(!fn())throw Error('condition false');c.push([n,true])}catch(e){c.push([n,false,e.message])}};check('Four synthetic evidence entries render',()=>d.querySelectorAll('#items .item').length===4);check('Missing and conflict counts derive from fixture',()=>d.querySelector('#missing').textContent===String(a.filter(x=>x.state==='Missing').length)&&d.querySelector('#conflicts').textContent===String(a.filter(x=>x.state==='Conflict').length));check('No source is represented as verified',()=>d.querySelector('#verified').textContent===String(a.filter(x=>x.sourceAuthority==='Verified').length));check('Conflict filter isolates one record',()=>{const s=d.querySelector('#filter');s.value='Conflict';s.dispatchEvent(new w.Event('change',{bubbles:true}));return d.querySelectorAll('#items .item').length===1});check('Search narrows to the organization claim',()=>{const s=d.querySelector('#filter');s.value='all';s.dispatchEvent(new w.Event('change',{bubbles:true}));const q=d.querySelector('#search');q.value='self-reported';q.dispatchEvent(new w.Event('input',{bubbles:true}));return d.querySelectorAll('#items .item').length===1});check('Unmatched search displays empty state',()=>{const q=d.querySelector('#search');q.value='nothing-matches';q.dispatchEvent(new w.Event('input',{bubbles:true}));return !!d.querySelector('.empty')});document.querySelector('#results').innerHTML=c.map(([n,ok,e])=>'<li class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+n+(e?' ('+e+')':'')+'</li>').join('')});
</script></body></html>
