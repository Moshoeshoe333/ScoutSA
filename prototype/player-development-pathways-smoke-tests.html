<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA pathway tracker smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:950px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:900px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Player development pathway — smoke tests</h1><p>Fixture and UI checks only. These do not validate real-world development, age, consent, safeguarding, evidence or outcomes.</p><ol id="results"></ol><iframe id="app" src="./player-development-pathways.html" title="Pathway tracker under test"></iframe><script>
const out=document.querySelector("#results");function test(n,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+n;out.append(li)}
document.querySelector("#app").addEventListener("load",()=>{const d=document.querySelector("#app").contentDocument,w=document.querySelector("#app").contentWindow;try{const x=w.SCOUTSA_PATHWAYS_DEMO;test("two fictional player pathways load",x.players.length===2);test("six defined stages per player",x.stages.length===6&&x.players.every(p=>p.stages.length===6));test("no outcome is recorded in either sample",x.players.every(p=>p.stages[5].state==="Not recorded"));test("age and under-18 protection warning is visible",d.body.innerText.includes("Under-18 protections"));test("evidence and next-step details render for every stage",d.querySelectorAll(".stage").length===6&&[...d.querySelectorAll(".stage")].every(s=>s.querySelector(".evidence")&&s.querySelector(".next")));test("no contact, invitation or mutation controls",!d.querySelector("form,button[type=submit],input")&&!/invite player|contact player|publish profile/i.test(d.body.innerText));d.querySelector("#playerSelect").value=x.players[1].id;d.querySelector("#playerSelect").dispatchEvent(new w.Event("change"));test("player selector changes pathway",d.querySelector("#playerName").textContent.includes("Lerato Nkosi"));}catch(e){test("test harness completed without runtime error: "+e.message,false)}});
</script></body></html>
