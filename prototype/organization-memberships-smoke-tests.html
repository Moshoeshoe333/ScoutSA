<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA membership prototype smoke tests</title><style>body{font:15px/1.5 system-ui;max-width:850px;margin:35px auto;padding:0 18px;color:#17263a}button{padding:10px 14px;border:0;border-radius:8px;background:#16845f;color:white;font-weight:700}iframe{width:100%;height:700px;border:1px solid #ccd5df;border-radius:10px;margin-top:16px}.pass{color:#16845f}.fail{color:#a43f42}</style></head><body><h1>Organization Membership UI smoke tests</h1><p>These checks cover rendering and client-side filtering only. They do not test authorization, RLS, security, privacy, verification, safeguarding or legal compliance.</p><button id="run">Run smoke tests</button><ol id="results"></ol><iframe title="Membership prototype under test" src="./organization-memberships.html"></iframe><script>
document.querySelector('#run').addEventListener('click',async()=>{const frame=document.querySelector('iframe');await new Promise(resolve=>{if(frame.contentDocument.readyState==='complete')resolve();else frame.addEventListener('load',resolve,{once:true})});const d=frame.contentDocument,w=frame.contentWindow,checks=[];const check=(name,fn)=>{try{if(!fn())throw Error('condition false');checks.push([name,true])}catch(e){checks.push([name,false,e.message])}};check('All four workflow states are represented',()=>['Pending','Active','Ended','Disputed'].every(s=>d.querySelector('[data-membership-status="'+s+'"]')));check('Organization identity is labelled unverified',()=>d.querySelectorAll('#orgList .unverified').length===3);check('Active state is not presented as verification',()=>[...d.querySelectorAll('[data-membership-status="Active"]')].some(x=>x.textContent.includes('Not verified')));check('Search filters the membership list',()=>{const input=d.querySelector('#search');input.value='Lerato';input.dispatchEvent(new w.Event('input',{bubbles:true}));return d.querySelectorAll('#records .record').length===2});check('Status filter narrows to disputed entries',()=>{const select=d.querySelector('#statusFilter');select.value='Disputed';select.dispatchEvent(new w.Event('change',{bubbles:true}));return d.querySelectorAll('#records .record').length===1&&d.querySelector('#records .record').dataset.membershipStatus==='Disputed'});check('Empty search state is available',()=>{d.querySelector('#search').value='no-match';d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));return !!d.querySelector('.empty')});document.querySelector('#results').innerHTML=checks.map(([n,ok,err])=>'<li class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+n+(err?' ('+err+')':'')+'</li>').join('');});
</script></body></html>
