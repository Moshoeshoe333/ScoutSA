<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA invitation workflow smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:950px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:850px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Safeguarded invitation workflow — smoke tests</h1><p>Local UI and fixture checks only. They do not test identity, age assurance, consent, safeguarding, legal compliance, authorization, RLS, persistence or any real invitation process.</p><ol id="results"></ol><iframe id="app" src="./safeguarded-invitations.html" title="Invitation workflow under test"></iframe><script>
const out=document.querySelector("#results");function test(name,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+name;out.append(li)}
const frame=document.querySelector("#app");frame.addEventListener("load",()=>{const d=frame.contentDocument,w=frame.contentWindow;try{const data=w.SCOUTSA_INVITATION_WORKFLOW.cases;test("two synthetic cases load",data.length===2);test("no case is invitation-ready",data.every(c=>!w.canProceed(c))&&d.querySelector("#ready").textContent==="0");test("all cases have eight required gates",data.every(c=>c.gates.length===8));test("under-18 or unknown-age protections are counted",d.querySelector("#protected").textContent==="2");test("guardian and safe-contact hard stops exist",data.every(c=>c.hardStops.some(s=>/guardian|under-18/i.test(s))));test("no direct contact or invitation action is rendered",!d.querySelector("button,form,input[type=submit]")&&!/send invitation|contact player/i.test(d.body.innerText));d.querySelector("#search").value="Regional Talent";d.querySelector("#search").dispatchEvent(new w.Event("input"));test("search filters scenario cards",d.querySelectorAll(".case").length===1);d.querySelector("#search").value="";d.querySelector("#search").dispatchEvent(new w.Event("input"));test("hard-stop total derives from fixture",d.querySelector("#stops").textContent===String(data.reduce((n,c)=>n+c.hardStops.length,0)));}catch(e){test("test harness completed without runtime error: "+e.message,false)}});
</script></body></html>
