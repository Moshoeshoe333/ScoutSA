<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA Discovery Request Smoke Tests</title>
<style>body{font:14px/1.5 system-ui,sans-serif;max-width:850px;margin:30px auto;padding:0 16px;color:#17263a}button{padding:9px 13px;border:1px solid #ccd6e1;border-radius:8px;background:white;cursor:pointer}.pass{color:#14714f}.fail{color:#a33}.muted{color:#69798e}li{margin:7px 0}</style></head>
<body><h1>Discovery & Request Review — UI smoke checks</h1><p class="muted">Local fixture and rendering checks only. This page does not test security, authorization, privacy, persistence or legal compliance.</p><button id="run" disabled>Loading prototype…</button><p id="summary">Not run.</p><ol id="results"></ol>
<iframe title="Discovery request prototype under test" src="./discovery-request.html" style="width:100%;height:1100px;border:1px solid #ddd;border-radius:10px;margin-top:20px"></iframe>
<script>
const testFrame=document.querySelector("iframe");const runButton=document.getElementById("run");
testFrame.addEventListener("load",()=>{runButton.disabled=false;runButton.textContent="Run smoke tests";});
runButton.addEventListener("click",()=>{
 const checks=[
 ["Three synthetic request cases exist",()=>document.querySelector("iframe").contentWindow.SCOUTSA_DISCOVERY_REQUESTS.records.length===3],
 ["Request page and fixture load in iframe",()=>{const f=document.querySelector("iframe");return !!f.contentWindow.document.getElementById("requestList")&&!!f.contentWindow.SCOUTSA_DISCOVERY_REQUESTS}],
 ["Every sample request is held",()=>{const d=document.querySelector("iframe").contentWindow.SCOUTSA_DISCOVERY_REQUESTS;return d.records.length===3&&d.records.every(x=>x.state==="HOLD — NOT SUBMITTABLE")}],
 ["Unknown age has under-18 protections",()=>document.querySelector("iframe").contentWindow.SCOUTSA_DISCOVERY_REQUESTS.records.some(x=>x.ageState.startsWith("Unknown — under-18"))],
 ["No sample grants purpose-specific consent",()=>document.querySelector("iframe").contentWindow.SCOUTSA_GUARDIAN_CONSENT_DEMO.cases.every(c=>c.consentState==="Not given"&&c.purposes.every(p=>p.state==="Not given"))],
 ["No sample organization is verified",()=>document.querySelector("iframe").contentWindow.SCOUTSA_DEMO_MEMBERSHIPS.organizations.every(o=>o.identityStatus!=="Verified")],
 ["Organization representative authority remains unestablished",()=>document.querySelector("iframe").contentWindow.SCOUTSA_ACADEMY_WORKSPACE_DEMO.organization.authority==="Not established"],
 ["Missing or mismatched Passport and membership links remain visible",()=>{const d=document.querySelector("iframe").contentWindow.document;const b=d.querySelector('button[data-id="REQ-DEMO-003"]');b.click();return d.body.innerText.includes("Missing or unresolved")&&d.body.innerText.includes("Missing or mismatched")}],
 ["No sample opportunity is verified",()=>document.querySelector("iframe").contentWindow.SCOUTSA_DEMO_OPPORTUNITIES.records.every(o=>o.verification!=="Verified")],
 ["No request submission or contact control is rendered",()=>{const d=document.querySelector("iframe").contentWindow.document;return !d.querySelector("form")&&!d.querySelector("input,textarea")&&!Array.from(d.querySelectorAll("button")).some(b=>/submit|send|contact|invite/i.test(b.textContent))}],
 ["Request boundary language is present",()=>document.querySelector("iframe").contentWindow.document.body.innerText.includes("not an invitation")],
 ["No production security or persistence claim is made",()=>document.querySelector("iframe").contentWindow.SCOUTSA_DISCOVERY_REQUESTS.limits.some(x=>x.includes("No authentication"))]
 ];
 const results=document.getElementById("results");results.innerHTML="";let passed=0;
 checks.forEach(([label,fn])=>{let ok=false;try{ok=!!fn()}catch(e){}if(ok)passed++;const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+label;results.appendChild(li)});
 document.getElementById("summary").textContent=passed+" / "+checks.length+" checks passed in this browser session.";
});
</script></body></html>
