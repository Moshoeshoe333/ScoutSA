<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScoutSA decision worksheet smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:650px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Opportunity decision worksheet — smoke tests</h1><p>Local UI checks only. They do not test authentication, authorization, RLS, persistence, audit integrity, evidence authenticity, privacy, safeguarding or legal compliance.</p><ol id="results"></ol><iframe id="app" src="./opportunity-decisions.html" title="Decision worksheet under test"></iframe><script>
const out=document.querySelector("#results");function test(name,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+name;out.append(li)}
const frame=document.querySelector("#app");frame.addEventListener("load",()=>{const d=frame.contentDocument,w=frame.contentWindow;try{
test("four synthetic initial decisions render",d.querySelectorAll("#items .item").length===4);
test("decision counts derive from fixture",d.querySelector("#total").textContent==="4"&&d.querySelector("#investigate").textContent==="1"&&d.querySelector("#second").textContent==="1"&&d.querySelector("#blocked").textContent==="1");
d.querySelector("#filter").value="Blocked";d.querySelector("#filter").dispatchEvent(new w.Event("change"));test("Blocked filter isolates one decision",d.querySelectorAll("#items .item").length===1&&d.querySelector("#items").textContent.includes("Blocked"));
d.querySelector("#filter").value="all";d.querySelector("#filter").dispatchEvent(new w.Event("change"));d.querySelector("#search").value="EVD-DEMO-002";d.querySelector("#search").dispatchEvent(new w.Event("input"));test("search narrows to matching evidence reference",d.querySelectorAll("#items .item").length===1);
d.querySelector("#search").value="no-such-record";d.querySelector("#search").dispatchEvent(new w.Event("input"));test("unmatched search shows empty state",d.querySelector("#items").textContent.includes("No decision entries"));
d.querySelector("#search").value="";d.querySelector("#search").dispatchEvent(new w.Event("input"));d.querySelector("#evidenceId").value="EVD-DEMO-TEST";d.querySelector("#claimScope").value="Specific test claim";d.querySelector("#status").value="Accepted for Claim";d.querySelector("#reviewer").value="Reviewer test";d.querySelector("#reason").value="Accepted only for the exact synthetic claim after review.";d.querySelector("#decisionForm").dispatchEvent(new w.Event("submit",{bubbles:true,cancelable:true}));test("valid decision adds a session-only entry",d.querySelectorAll("#items .item").length===5&&d.querySelector("#items").textContent.includes("Accepted for Claim"));
}catch(e){test("test harness completed without runtime error: "+e.message,false)}});
</script></body></html>
