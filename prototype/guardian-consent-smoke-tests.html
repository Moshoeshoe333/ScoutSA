<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guardian consent smoke tests</title><style>body{font:14px/1.5 system-ui,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;color:#17263a}li{margin:8px 0}.pass{color:#16845f}.fail{color:#a43f42}iframe{width:100%;height:1000px;border:1px solid #ddd;border-radius:10px}</style></head><body><h1>Guardian & consent workspace — smoke tests</h1><p>Fixture and UI checks only. They do not validate legal sufficiency, identity, consent, security, access control or safeguarding practice.</p><ol id="results"></ol><iframe id="app" src="./guardian-consent.html" title="Consent workspace under test"></iframe><script>const out=document.querySelector("#results"),f=document.querySelector("#app");function t(n,ok){const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS — ":"FAIL — ")+n;out.append(li)}f.addEventListener("load",()=>{const d=f.contentDocument,w=f.contentWindow,x=w.SCOUTSA_GUARDIAN_CONSENT_DEMO;try{t("three fictional cases render",x.cases.length===3&&d.querySelectorAll(".case").length===3);t("unknown age case visibly blocks disclosure",x.cases.some(c=>c.ageState==="Unknown"&&c.disclosure==="Blocked")&&d.body.innerText.includes("Unknown"));t("guardian authority and player voice are distinct",x.cases.every(c=>Object.hasOwn(c,"guardianState")&&Object.hasOwn(c,"playerVoice")));t("three separate purposes shown for selected case",d.querySelectorAll(".purpose").length===3);t("no consent collection or upload controls",!d.querySelector("input,textarea,form,select,[type=submit],button[type=submit]"));t("withdrawal, expiry and safeguards rules are visible",d.body.innerText.includes("withdraw")&&d.body.innerText.includes("time-bounded")&&d.body.innerText.includes("under-18"));t("no real consent, authentication or enforcement claims",d.body.innerText.includes("No real consent should be collected")&&d.body.innerText.includes("no authentication"));d.querySelector('[data-case="GCS-DEMO-002"]').click();t("scenario selector changes selected case",d.querySelector("#caseTitle").textContent.includes("GCS-DEMO-002")&&d.querySelector("#caseDetails").innerText.includes("Unknown"));}catch(e){t("test harness completed without runtime error: "+e.message,false)}});</script></body></html>
