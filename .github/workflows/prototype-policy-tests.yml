name: ScoutSA prototype policy and documentation tests

on:
  push:
    branches:
      - prototype/internal-demo
    paths:
      - "README.md"
      - "docs/**"
      - "prototype/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "prototype/**"
      - ".github/workflows/**"
  workflow_dispatch:
concurrency:
  group: scoutsa-prototype-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-and-documentation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run headless policy and documentation tests
        run: node --test prototype/tests/*.test.js
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Run Discovery & Request Review browser smoke test
        run: node prototype/tests/discovery-request.browser-smoke.cjs
      - name: Run unified workspace hub browser smoke test
        run: node prototype/tests/workspace-hub.browser-smoke.cjs
      - name: Run player journey preview browser smoke test
        run: node prototype/tests/player-preview.browser-smoke.cjs
      - name: Run Vaal ecosystem coverage browser smoke test
        run: node prototype/tests/vaal-ecosystem-coverage.browser-smoke.cjs
      - name: Run tournament relationship hub browser smoke test
        run: node prototype/tests/tournament-intelligence.browser-smoke.cjs
      - name: Run tournament manager browser smoke test
        run: node prototype/tests/tournament-manager.browser-smoke.cjs
      - name: Run tournament day operations browser smoke test
        run: node prototype/tests/tournament-day-operations.browser-smoke.cjs
      - name: Run tournament statistic reconciliation browser smoke test
        run: node prototype/tests/tournament-stat-reconciliation.browser-smoke.cjs
      - name: Run tournament organizer portal browser smoke test
        run: node prototype/tests/tournament-organizer-portal.browser-smoke.cjs
      - name: Run specialist workspace interaction browser smoke test
        run: node prototype/tests/workspace-interactions.browser-smoke.cjs
