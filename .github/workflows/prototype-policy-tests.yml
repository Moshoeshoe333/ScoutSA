name: ScoutSA prototype policy and documentation tests

on:
  push:
    branches:
      - prototype/internal-demo
    paths:
      - "README.md"
      - "docs/**"
      - "prototype/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "prototype/**"
      - ".github/workflows/**"
  workflow_dispatch:
concurrency:
  group: scoutsa-prototype-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy-and-documentation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run headless policy and documentation tests
        run: node --test prototype/tests/*.test.js
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium for browser smoke test
        timeout-minutes: 7
        run: npx playwright install chromium
      - name: Run all browser smoke tests and report every failure
        timeout-minutes: 8
        shell: bash
        run: |
          set +e
          failed=0
          for test in \
            prototype/tests/discovery-request.browser-smoke.cjs \
            prototype/tests/workspace-hub.browser-smoke.cjs \
            prototype/tests/player-preview.browser-smoke.cjs \
            prototype/tests/vaal-ecosystem-coverage.browser-smoke.cjs \
            prototype/tests/tournament-intelligence.browser-smoke.cjs \
            prototype/tests/tournament-manager.browser-smoke.cjs \
            prototype/tests/tournament-day-operations.browser-smoke.cjs \
            prototype/tests/tournament-stat-reconciliation.browser-smoke.cjs \
            prototype/tests/tournament-organizer-portal.browser-smoke.cjs \
            prototype/tests/tournament-organizer-cleanup.browser-smoke.cjs \
            prototype/tests/workspace-interactions.browser-smoke.cjs
          do
            echo "::group::$test"
            timeout 90s node "$test"
            result=$?
            echo "::endgroup::"
            if [ "$result" -ne 0 ]; then
              echo "::error file=$test::Browser smoke test failed or timed out (exit $result)"
              failed=1
            fi
          done
          exit "$failed"
