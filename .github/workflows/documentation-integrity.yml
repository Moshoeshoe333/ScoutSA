name: ScoutSA mainline documentation integrity

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/00-gate-status.md"
      - "docs/engineering-integrity.md"
      - "docs/tests/**"
      - ".github/workflows/documentation-integrity.yml"
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/00-gate-status.md"
      - "docs/engineering-integrity.md"
      - "docs/tests/**"
      - ".github/workflows/documentation-integrity.yml"

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run mainline documentation integrity tests
        run: node --test docs/tests/*.test.js
