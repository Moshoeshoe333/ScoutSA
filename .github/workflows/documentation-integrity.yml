name: ScoutSA mainline documentation integrity

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run mainline documentation integrity tests
        run: node --test docs/tests/*.test.js
