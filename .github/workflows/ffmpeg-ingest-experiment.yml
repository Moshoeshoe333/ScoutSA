name: FFmpeg ingestion experiment

on:
  push:
    branches:
      - experiment/ffmpeg-player-video-ingest
    paths:
      - "experiments/ffmpeg-ingest/**"
      - ".github/workflows/ffmpeg-ingest-experiment.yml"
  pull_request:
    paths:
      - "experiments/ffmpeg-ingest/**"
      - ".github/workflows/ffmpeg-ingest-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ffmpeg-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/ffmpeg-ingest/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run isolated unit tests
        run: python -m pytest -q
