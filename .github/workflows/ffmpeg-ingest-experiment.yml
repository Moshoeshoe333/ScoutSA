name: FFmpeg ingestion experiment

on:
  push:
    branches:
      - experiment/ffmpeg-player-video-ingest
    paths:
      - "experiments/ffmpeg-ingest/**"
      - ".github/workflows/ffmpeg-ingest-experiment.yml"
  pull_request:
    paths:
      - "experiments/ffmpeg-ingest/**"
      - ".github/workflows/ffmpeg-ingest-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/ffmpeg-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/ffmpeg-ingest/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run isolated unit tests
        run: python -m pytest -q

  real-ffmpeg-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install experiment
        working-directory: experiments/ffmpeg-ingest
        run: python -m pip install .
      - name: Generate synthetic video with audio and metadata
        run: |
          mkdir -p "$RUNNER_TEMP/scoutsa-input"
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "color=c=blue:s=640x360:r=25:d=2" \
            -f lavfi -i "sine=frequency=1000:duration=2" \
            -shortest -metadata title="synthetic-private-metadata" \
            -c:v libx264 -c:a aac "$RUNNER_TEMP/scoutsa-input/source.mp4"
      - name: Process synthetic video
        run: |
          scoutsa-video-ingest "$RUNNER_TEMP/scoutsa-input/source.mp4" \
            --output-dir "$RUNNER_TEMP/scoutsa-output"
      - name: Verify derivative contains video only and no copied title metadata
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import subprocess

          outputs = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "scoutsa-output", "*.mp4"))
          assert len(outputs) == 1, outputs
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type:format_tags",
               "-of", "json", outputs[0]],
              capture_output=True, text=True, check=True,
          )
          details = json.loads(probe.stdout)
          assert [s["codec_type"] for s in details["streams"]] == ["video"], details
          assert details.get("format", {}).get("tags", {}).get("title") != "synthetic-private-metadata", details
          print("Real FFmpeg smoke test passed: video-only derivative; no copied source title metadata (muxer technical tags may remain).")
          PY
